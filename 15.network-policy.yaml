apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: backend
spec:
  podSelector:
    matchLabels: app=backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: frontend
          podSelector:
            matchLabels: app=frontend

# Test the network policy
# Create a pod in Frontend namespace
# kubectl run test-frontend --image=busybox:stable -n frontend -it --rm -- sh

