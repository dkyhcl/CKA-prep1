Create gateway controller
===========================
kubectl apply -f https://github.com/envoyproxy/gateway/releases/download/v1.0.2/install.yaml
# Create gateway class
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nginx-class
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

---
# Create Gateway

kind: Gateway
metadata:
  name: web-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: gateway.web.k8s.local

---
# Create HTTP Route

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
spec:
  parentRefs:
    - name: web-gateway

  hostnames:
    - gateway.web.k8s.local

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web-service
          port: 80

---
