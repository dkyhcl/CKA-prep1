# Create CongigMap from nginx.conf
#kubectl -n nginx-static create configmap nginx-config --from-file=nginx.conf

# Create tls.crt and tls.key using openssl command
#openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt -subj "/CN=web.k8s.local"

# Create secret using the generated tls.crt and tls.key
#kubectl -n nginx-static create secret tls nginx-tls --cert=tls.crt --key=tls.key

# Create a deployment that mounts the ConfigMap and Secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
  namespace: nginx-static
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-tls
              mountPath: /etc/nginx/certs
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: nginx-tls
          secret:
            secretName: nginx-tls

# Port forward to access the nginx server
#kubectl -n nginx-static port-forward svc/nginx-svc 8443:443

# Curl commands to test the TLS connection
#curl -k --tls-max 1.2 https://localhost:8443
#curl -k --tls-max 1.3 https://localhost:8443
