# kubectl autoscale deployment apache-server --cpu=50% --min=1 --max=4 -n autoscale dry-run=client -o yaml > hpa.yaml

# This file will be generated by the above command. Edit the file and add scaleDown behavior to it as shown below. After editing, apply the file using kubectl apply -f hpa.yaml command.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apache-server
  namespace: autoscale
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apache-server
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30

---
# Add this to hpa.yaml file
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30
