apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 999999999
globalDefault: false
description: "This priority class should be used for XYZ service pods only."
---
apiVersion: v1
kind: Namespace
metadata:
  name: priority
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-logger
  namespace: priority
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox-logger
  template:
    metadata:
      labels:
        app: busybox-logger
    spec:
      priorityClassName: high-priority
      containers:
        - name: busybox
          image: busybox:stable
          command:
            ["/bin/sh", "-c", "while true; do echo 'Logging...'; sleep 5; done"]

